# Calls winui-app-kit's reusable Store workflow (CI-10, REL-7), from the kit's caller example.
# Keep the `uses:` tag equal to the external/winui-app-kit pin; the kit's workflow stops at its first
# step if they differ. A v* tag runs the gate, uploads both architectures to Partner Center as a draft
# with the notes from release-notes/, and stops. A manual run on that tag with submit_draft set
# submits it; hold_publication (on by default here) keeps a certified update waiting until it is
# released by hand in Partner Center. inspect_draft reports a submission without changing it, and
# dry_run builds and checks everything without any Store call.
name: Publish to Microsoft Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, bundle and check, then stop before any Store call'
        type: boolean
        default: false
      no_commit:
        description: 'Stage a draft for review in Partner Center without submitting'
        type: boolean
        default: true
      repair_draft:
        description: 'Existing draft ID to repair with both architectures; requires no_commit'
        type: string
        default: ''
      replace_canceled_draft:
        description: 'Exact canceled tier submission ID to replace with a corrected release'
        type: string
        default: ''
      submit_draft:
        description: 'Draft ID from the tag run to submit for certification; run on that release tag with no_commit unchecked'
        type: string
        default: ''
      replace_failed_draft:
        description: 'Exact CommitFailed submission ID to replace after correcting its package'
        type: string
        default: ''
      failed_upload:
        description: 'Exact upload filename in the failed submission being replaced'
        type: string
        default: ''
      hold_publication:
        description: 'With submit_draft: hold the release for manual publication in Partner Center'
        type: boolean
        # This app's practice: a certified update waits for a person to release it.
        default: true
      inspect_draft:
        description: 'Submission ID to report (status, pricing, publishing mode) without changing anything'
        type: string
        default: ''

permissions:
  contents: read

# One Store run at a time, and never cancel one that has started talking to Partner Center.
concurrency:
  group: store-package
  cancel-in-progress: false

jobs:
  publish:
    uses: Dynamic-Solutions-Canada/winui-app-kit/.github/workflows/store-publish.yml@v1.21.1
    with:
      store_product_id: 9P3ZZBDQ6PJF
      # Paid, US $0.99: the tier verified with Partner Center (see docs/installer.md).
      price_tier: Tier1012
      # No steps of its own: the MSIX images are committed.
      pre_build: ''
      # The gate run first, on Linux (CI-4). The Node tests load the Linux browser's packages,
      # which the kit's gate job does not install, so install them from the lockfile first.
      gate_command: 'npm ci --prefix linux/browser --no-audit --no-fund && npm run validate'
      # The Google Drive desktop OAuth client secret is compiled in from this build property
      # (Directory.Build.props); the kit sets it from BUILD_SECRET for packaging only.
      build_secret_env_name: 'GoogleClientSecret'
      # A tag run is always a draft (REL-7); these only matter for manual runs.
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      no_commit: ${{ github.event_name == 'push' || inputs.no_commit }}
      repair_draft: ${{ inputs.repair_draft || '' }}
      replace_canceled_draft: ${{ inputs.replace_canceled_draft || '' }}
      submit_draft: ${{ inputs.submit_draft || '' }}
      replace_failed_draft: ${{ inputs.replace_failed_draft || '' }}
      failed_upload: ${{ inputs.failed_upload || '' }}
      # The kit applies hold_publication only to submit_draft runs and ignores it on dry runs,
      # repairs and drafts, so the input's default of true is safe to pass straight through.
      hold_publication: ${{ github.event_name == 'workflow_dispatch' && inputs.hold_publication }}
      inspect_draft: ${{ inputs.inspect_draft || '' }}
    # Explicit, not inherit: the reusable workflow gets exactly the Store credentials (CI-11) and the
    # one build secret.
    secrets:
      AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      SELLER_ID: ${{ secrets.SELLER_ID }}
      BUILD_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
