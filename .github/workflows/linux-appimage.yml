name: Linux AppImage

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source tag or commit to build (defaults to the selected ref)'
        type: string
        required: false
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: linux/browser/package-lock.json
      - name: Fetch the locked Electron engine
        run: npm ci --prefix linux/browser
      # Electron 45 downloads lazily; packaging reads dist without starting the CLI.
      - name: Download the locked Electron binary
        run: node linux/browser/node_modules/electron/install.js
      - name: Build AppImage in the Debian 12 runtime container
        run: npm run package:linux -- --engine-dir linux/browser/node_modules/electron/dist --output .artifacts/linux-appimage
      - name: Verify AppImage extraction and bundled imports
        run: |
          image=$(find .artifacts/linux-appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          "$image" --appimage-extract
          # The desktop supplies EGL/GL; the hosted headless runner need not have them.
          docker run --rm --network none --memory 512m --memory-swap 512m --cpus 1 --pids-limit 128 \
            --user "$(id -u):$(id -g)" -e QT_QPA_PLATFORM=offscreen \
            -v "$PWD/squashfs-root:/app:ro" little-launcher-appimage-builder:local \
            /app/usr/bin/python3.11 -I -c "import sys;sys.path.insert(0,'/app/usr/lib/python3.11/site-packages');from PySide6 import QtWidgets,QtNetwork,QtDBus;import dbus_next"
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-AppImage
          path: |
            .artifacts/linux-appimage/*.AppImage
            .artifacts/linux-appimage/*.AppImage.sha256
