name: Build and Package

# On a v* tag: run the gate (CI-4), check that the MSIX packages build for x64 and ARM64, build the
# Linux AppImage, then create the GitHub Release from the committed notes (REL-5, REL-6).
# workflow_dispatch runs the gate and the builds only.
#
# No Windows build is published anywhere, on purpose (DIST-5, D-020). Little Launcher is a paid
# Microsoft Store app in a public repo, and an Actions artifact or Release asset on a public repo can
# be downloaded by anyone. The Windows install route is the Microsoft Store. The Linux AppImage has
# no paid channel, so the Release attaches it with SHA256SUMS; the in-app Linux updater fetches it by
# its exact name (LittleLauncher-<version>-linux-x64.AppImage), so that name must not change.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Creates a GitHub Release, so a run in progress is never cancelled.
concurrency:
  group: build-msix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI-4: the same gate a developer runs, before anything is built or released.
  validate:
    name: Validate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Submodules too: the test runner, format and gitignore checks come from winui-app-kit.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: linux/browser/package-lock.json

      # The Linux browser modules the Node tests load (electron, from the lockfile). Electron's
      # engine binary downloads lazily, so this installs only the small packages.
      - name: Install the Linux browser packages
        run: npm ci --prefix linux/browser --no-audit --no-fund

      - name: Validate
        run: npm run validate

      # REL-6: the notes for the version must exist before anything is built. Never fall back to
      # commit subjects or generated notes.
      - name: Check release notes
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)"
          NOTES="release-notes/${VERSION}.md"
          if [ ! -s "${NOTES}" ]; then echo "::error::Missing release notes: ${NOTES}"; exit 1; fi

  build:
    name: Package (${{ matrix.platform }})
    needs: validate
    runs-on: windows-2025
    # Two self-contained publishes (app and Native AOT helper), makepri, makeappx and signing.
    timeout-minutes: 45
    strategy:
      matrix:
        platform: [x64, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Nothing from this build is published; it is the automated check that manifest stamping,
      # makepri, makeappx and signing still work, so a packaging break shows up on the tag rather
      # than at Store submission. It signs with a throwaway self-signed certificate made for this
      # run, with a random password that is never stored (DIST-2).
      - name: Build MSIX
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          $password = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          Write-Host "::add-mask::$password"
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=LittleLauncher-CI" `
            -KeyUsage DigitalSignature -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $pfx = Join-Path $env:RUNNER_TEMP "ci-signing.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx `
            -Password (ConvertTo-SecureString -String $password -Force -AsPlainText) | Out-Null
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey
          & "LittleLauncherMSIX/build-msix.ps1" -Platform $env:PLATFORM -TrustedPfxPath $pfx -TrustedPfxPassword $password
          $buildExit = $LASTEXITCODE
          Remove-Item $pfx -Force
          if ($buildExit -ne 0) { Write-Error "build-msix failed"; exit 1 }

  linux:
    name: Linux AppImage
    needs: validate
    uses: ./.github/workflows/linux-appimage.yml

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    # A tag gets no Release if the packages it names do not build.
    needs: [build, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # REL-1, REL-6: the tag must name the version in Directory.Build.props, and its notes must exist.
      - name: Read version and notes
        id: notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match <Version>${VERSION}</Version> in Directory.Build.props"
            exit 1
          fi
          NOTES="release-notes/${VERSION}.md"
          if [ ! -s "${NOTES}" ]; then echo "::error::Missing release notes: ${NOTES}"; exit 1; fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "body<<RELEASE_EOF"
            cat "${NOTES}"
            echo ""
            echo "## Get it"
            echo ""
            echo "**Windows:** [Little Launcher in the Microsoft Store](https://apps.microsoft.com/detail/9p3zzbdq6pjf). Store installs update automatically."
            echo ""
            echo "**Linux:** download \`LittleLauncher-${VERSION}-linux-x64.AppImage\` below, make it executable and run it (Debian 12 / Ubuntu 24.04 LTS or newer). \`SHA256SUMS\` lists its checksum."
            echo ""
            echo "*AI disclosure: this release and the related code were written with the assistance of AI.*"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download the Linux AppImage
        uses: actions/download-artifact@v8
        with:
          name: Linux-AppImage
          path: release

      # DIST-5: one SHA256SUMS file for the Release's assets.
      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd release
          sha256sum -- *.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Little Launcher ${{ steps.notes.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            release/*.AppImage
            release/SHA256SUMS
          make_latest: true
          generate_release_notes: false
