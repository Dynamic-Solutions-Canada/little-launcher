# Calls winui-app-kit's reusable credential reminder (CI-11), copied from the kit's caller example. It
# fails from 60 days before the Store secret expires. STORE_SECRET_EXPIRES is an organisation variable
# shared with the other Store apps; it is updated whenever the secret is rotated.
name: Credential Expiry

on:
  schedule:
    # Mondays at 13:00 UTC (9 a.m. Toronto in EDT, 8 a.m. in EST).
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credential-expiry
  cancel-in-progress: true

jobs:
  check:
    uses: Dynamic-Solutions-Canada/winui-app-kit/.github/workflows/credential-expiry.yml@v2.10.2
    with:
      expires: ${{ vars.STORE_SECRET_EXPIRES }}
