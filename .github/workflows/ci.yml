name: CI

# The push and pull request gate (CI-1). The Linux job runs the same `npm run validate` a developer
# runs locally, on every push to main and every pull request, with no path filter. The Windows
# compile (CI-3) costs Windows runner minutes, so it runs only when Windows app source, packaging or
# build configuration changed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Submodules too: the test runner, format and gitignore checks come from winui-app-kit.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # The root package.json only wraps scripts and has no lockfile (CI-6).
          package-manager-cache: false

      # format:check, check:gitignore, check:l10n, then the .NET harnesses and the Linux tests.
      - name: Validate
        run: npm run validate

  changes:
    name: Detect Windows-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Plain git instead of a third-party filter action. A push that creates main, or any case
      # where the base cannot be found, compiles rather than guessing.
      - name: Filter paths
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable base commit; compiling."
            echo "windows=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^(LittleLauncher/|LauncherShortcut/|LittleLauncherMSIX/|Shared/|external/|\.gitmodules$|Directory\.Build\.(props|targets)$|global\.json$|LittleLauncher\.slnx$|\.github/workflows/ci\.yml$)'
          if git diff --name-only "${BASE}" HEAD | grep -Eq "${pattern}"; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
          fi

  compile:
    name: Compile (Windows ${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    # A cold restore of the Windows App SDK plus the app and the helper; well under this when warm.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Called directly: the WSL build bridge that local builds use is not available on a runner.
      # Debug, the same compile `npm run verify:desktop` runs. No Google client secret is needed to
      # compile; the shipped build gets it in the Store workflow.
      - name: Compile the app
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          dotnet build LittleLauncher/LittleLauncher.csproj -c Debug "-p:Platform=$env:PLATFORM"
          if ($LASTEXITCODE -ne 0) { throw "Compile failed ($env:PLATFORM)" }
