version: 2

# Weekly, grouped updates (HYG-8). Every directory with a manifest is listed: the app and the two
# test harnesses that have package references (the helper and the third harness have none), the Linux
# browser engine's npm packages, and the workflows.

updates:
  - package-ecosystem: nuget
    directories:
      # Versions are central in the root Directory.Packages.props; the projects list the packages.
      - "/"
      - "/LittleLauncher"
      - "/tests/LittleLauncher.ItemReorder.Tests"
      - "/tests/LittleLauncher.Sync.Tests"
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # Shared with winui-app-kit (PLAT-5): an app never moves ahead of the kit's version.
      - dependency-name: Microsoft.WindowsAppSDK
      - dependency-name: NLog
      - dependency-name: CommunityToolkit.Mvvm
      # .NET-line packages follow the target framework: majors wait until the app targets that .NET.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/linux/browser"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # A new Electron major needs the Linux browser qualification first; take it as its own change.
      - dependency-name: electron
        update-types: ["version-update:semver-major"]
      # build-vendor.cjs compiles the vendored extension source; a TypeScript major needs an AppImage
      # build and the Linux browser checks first.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
