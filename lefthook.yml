# Git hooks (HYG-10): block what must never be committed. Hooks check staged files only and stay
# fast; tests belong to CI. Install lefthook, then run `lefthook install` once per clone.
min_version: 2.2.2

pre-commit:
  parallel: true
  jobs:
    - name: no signing material
      # Signing certificates and keys never live in a repo (SEC-11); the shared dev certificate
      # comes from the build tools.
      glob: "*.{pfx,cer,der,keystore,jks,snk}"
      run: 'echo "Signing material must not be committed: {staged_files}" && exit 1'

    - name: no credential folders or env files
      # Includes this repo's compile-time OAuth secrets file and throwaway token files.
      glob: "{.secrets/**,.aws/**,.windows-build/**,.env,.env.*,**/.env,**/.env.*,**/local.secrets.props,token,token.txt}"
      exclude:
        - "**.example"
      run: 'echo "Credentials and env files must not be committed: {staged_files}" && exit 1'

    - name: no settings files
      # A user's settings.json must never be committed (SEC-1, CONF-5).
      glob: "**/settings.json"
      exclude:
        - ".claude/settings.json"
        - ".vscode/settings.json"
        # Translation catalogs for the Settings area, not user data.
        - "Shared/Localization/**"
      run: 'echo "App data files must not be committed: {staged_files}" && exit 1'

    - name: no large files
      run: |
        for f in {staged_files}; do
          if [ -f "$f" ] && [ "$(wc -c < "$f")" -gt 5242880 ]; then
            echo "$f is over 5 MB; large files belong in a release asset, not the repo."
            exit 1
          fi
        done
