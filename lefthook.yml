# Git hooks (HYG-10): block what must never be committed. Hooks check staged files only and stay
# fast; tests belong to CI. Install lefthook, then run `lefthook install` once per clone.
min_version: 2.2.2

pre-commit:
  parallel: true
  jobs:
    - name: devkit precommit
      # The kit's devkit precommit (SCRIPT-1) refuses staged signing material and keys (.pfx, .p12,
      # .cer, .der, .jks, .keystore), .env files other than examples, anything under .secrets/,
      # staged text holding a private key, and files over 5 MB (large files belong in a release asset).
      run: external/winui-app-kit/scripts/devkit precommit --max-size 5MB

    - name: no other credential or signing files
      # What devkit precommit does not cover: AWS credentials, the build tools' signing folder,
      # strong-name keys (SEC-11), this repo's compile-time OAuth secrets file and throwaway token files.
      glob: "{.aws/**,.windows-build/**,*.snk,**/*.snk,**/local.secrets.props,token,token.txt}"
      run: 'echo "Credentials and signing material must not be committed: {staged_files}" && exit 1'

    - name: no settings files
      # A user's settings.json must never be committed (SEC-1, CONF-5).
      glob: "**/settings.json"
      exclude:
        - ".claude/settings.json"
        - ".vscode/settings.json"
        # Translation catalogs for the Settings area, not user data.
        - "Shared/Localization/**"
      run: 'echo "App data files must not be committed: {staged_files}" && exit 1'
